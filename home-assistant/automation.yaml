alias: SmartTube PartyQueue - Video starten
id: smarttube_partyqueue_play
mode: parallel
max: 10
triggers:
  - trigger: webhook
    webhook_id: smarttube_partyqueue_play
    allowed_methods:
      - POST
    local_only: true
conditions:
  - condition: template
    value_template: >-
      {{ trigger.json.target_tv in ['ke75', 'kd70'] }}
actions:
  - variables:
      target_entities:
        ke75: media_player.tv_game_adb
        kd70: media_player.schlafzimmer_tv_schlafzimmer
      target_entity: "{{ target_entities.get(trigger.json.target_tv) }}"
      smarttube_package: "{{ trigger.json.smarttube_package | default('org.smarttube.stable') }}"
  - action: androidtv.adb_command
    target:
      entity_id: "{{ target_entity }}"
    data:
      command: >-
        am start -a android.intent.action.VIEW
        -d "{{ trigger.json.url }}"
        {{ smarttube_package }}
