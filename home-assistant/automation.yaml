alias: SmartTube PartyQueue - Video starten
mode: parallel
max: 10
triggers:
  - trigger: webhook
    webhook_id: smarttube_partyqueue_play
    allowed_methods: [POST]
    local_only: true
actions:
  - action: androidtv.adb_command
    target:
      entity_id: media_player.android_tv
    data:
      command: >-
        am start -a android.intent.action.VIEW -d "{{ trigger.json.url }}" org.smarttube.stable
