# Pro TV eine passende Automation anlegen oder beide MediaSession-Entitäten hier als Trigger ergänzen.
# Trigger und app_id-Attribut an deine tatsächlichen Entitäten anpassen.
alias: SmartTube PartyQueue - Videoende melden
mode: parallel
max: 10
triggers:
  - trigger: state
    entity_id: media_player.tv_game_adb
    from: playing
    to: idle
    id: ke75
  - trigger: state
    entity_id: media_player.schlafzimmer_tv_schlafzimmer
    from: playing
    to: idle
    id: kd70
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state.attributes.get('app_id') == 'org.smarttube.stable' }}
actions:
  - action: rest_command.partyqueue_video_ended
    data:
      target_tv: "{{ trigger.id }}"

