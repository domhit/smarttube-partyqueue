alias: SmartTube PartyQueue - Fortschritt und Videoende
mode: parallel
max: 25
triggers:
  - trigger: state
    entity_id: media_player.android_tv
    id: wohnzimmer
conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state in ['playing','paused','idle'] }}"
actions:
  - action: rest_command.partyqueue_playback_progress
    data:
      target_tv: "{{ trigger.id }}"
      playback_state: "{{ trigger.to_state.state }}"
      media_position: "{{ trigger.to_state.attributes.get('media_position',0)|float(0) }}"
      app_id: "{{ trigger.to_state.attributes.get('app_id',trigger.from_state.attributes.get('app_id','') if trigger.from_state else '') }}"
