rest_command:
  partyqueue_playback_progress:
    url: "http://SYNOLOGY-IP:8787/api/playback/progress"
    method: POST
    headers: {X-Admin-Password: !secret partyqueue_admin_password, Content-Type: application/json}
    payload: '{"target_tv":"{{ target_tv }}","state":"{{ playback_state }}","media_position":{{ media_position|float(0) }},"app_id":"{{ app_id }}"}'
