<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PartyQueue</title><link rel="stylesheet" href="/static/style.css"></head><body class="guest-body"><main class="guest-app"><header id="guestHero" class="guest-hero"><div class="guest-hero-overlay"><span class="party-badge">🎉 PartyQueue</span><h1 id="party">PartyQueue</h1><p>Musik wünschen, voten und feiern</p></div></header><div id="locked"></div><section class="card guest-card"><h2>Teilnehmen</h2><div class="guest-fields"><label>Dein Name<input id="name" autocomplete="name" placeholder="Dein Name"></label><label id="tvChooser">Wiedergabe auf<select id="tv"></select></label></div></section><section class="card guest-card"><h2>▶ Läuft gerade</h2><div id="current">Noch nichts</div></section><section class="card guest-card"><h2>Song suchen</h2><div id="searchStatus" class="search-status"></div><form id="searchForm" class="guest-form"><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Interpret oder Songtitel"><button id="search" type="submit">🔍 Suchen</button></form><p id="msg" aria-live="polite"></p><div id="results" class="guest-results"></div></section><section class="card guest-card"><details><summary>YouTube-Link einfügen</summary><form id="urlForm" class="guest-form"><input id="url" type="url" enterkeyhint="send" inputmode="url" placeholder="https://youtube.com/..."><button id="addUrl" type="submit">Hinzufügen</button></form></details></section><section class="card guest-card"><h2>📋 Wünsche</h2><div id="queue" class="guest-queue">Leer</div></section><footer class="guest-footer">SmartTube PartyQueue V4.5.0-alpha1</footer></main><div id="toast"></div><script src="/static/guest.js"></script></body></html>
