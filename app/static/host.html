<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PartyQueue Host</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><div class="top"><h1>🎛️ PartyQueue V2.4</h1><a href="/">Gastansicht</a></div><section class=card><div class=row><input id=pw type=password class=grow placeholder=Admin-Passwort><button id=login>Anmelden</button></div><p id=msg></p></section><div id=host class=hidden><div id=lockBanner class=banner></div><section class=card><h2>Aktive Party</h2><div class=row><input id=partyName class=grow><select id=playlist></select><select id=defaultTv></select></div><div id=devices class=checks></div><div class=row><label>Wunschlimit <input id=limit type=number min=0></label><label>Wiederholungsschutz <input id=repeat type=number min=0></label><label><input id=playlistEnabled type=checkbox> Grundplaylist aktiv</label><label><input id=upvotes type=checkbox> Upvote-Sortierung</label><label><input id=externalSkip type=checkbox> SmartTube-Skip erkennen</label></div><div class=actions><button id=saveParty>Speichern</button><button id=toggleLock class=secondary></button><button id=newParty>Neue Party</button></div></section><section class=card><h2>Abspieler</h2><div class=row><select id=tv class=grow></select><button id=start>Start</button><button id=skip>⏭ Skip</button></div><div id=current></div><div id=queue></div></section><section class=card><h2>Grundplaylists</h2><div class=row><input id=newPlaylistName class=grow placeholder="Neue Playlist"><button id=createPlaylist>Erstellen</button></div><div class=row><input id=playlistUrl class=grow placeholder="YouTube-Playlist-URL"><button id=importPlaylist>Importieren</button></div><div id=playlistItems></div></section><section class=card><h2>Party-Verlauf</h2><div class=actions><button data-export=html>HTML</button><button data-export=csv>CSV</button><button data-export=json>JSON</button><button data-export=m3u>M3U</button></div><div id=history></div></section><section class=card><h2>Statistik</h2><button id=loadStats>Laden</button><div id=stats></div></section></div></main><div id=toast></div><script src="/static/host.js"></script></body></html>
